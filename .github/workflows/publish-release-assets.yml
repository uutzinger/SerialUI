name: Publish Release Assets
run-name: Publish release ${{ inputs.tag }} (${{ inputs.request_id || github.run_id }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish packages for
        required: true
        type: string
      build_ref:
        description: Build ref at the release commit (defaults to the tag)
        default: ''
        type: string
      platforms:
        description: Comma-separated platforms (linux,macos,windows,raspbian)
        default: linux,macos,windows
        type: string
      request_id:
        description: Identifier used by the release script to track this run
        default: ''
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: publish-release-assets-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_REF: ${{ inputs.build_ref }}
      PLATFORMS: ${{ inputs.platforms }}
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse builds and publish archives directly to release
        shell: bash
        run: |
          python3 scripts/publish_release_assets.py \
            --repo "$GH_REPO" --tag "$RELEASE_TAG" \
            --build-ref "$BUILD_REF" --platforms "$PLATFORMS"
